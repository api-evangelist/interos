aid: interos
name: Interos
description: >-
  Interos operates an automated supplier-resilience platform that maps and continuously
  monitors extended, multi-tier supply chains for Fortune 1000 companies and federal
  agencies. Its cloud-native, multi-tenant SaaS uses AI and a large B2B relationship
  graph to deliver real-time, multi-domain risk scores and alerts. The public Interos
  API (REST/JSON, OpenAPI 3.0.2) exposes organization search, organization and risk
  profiles, the supplier relationship graph, organization groups, custom fields, and
  scenario watchlists, authenticated with x-api-key and x-customer-id headers.
  Headquartered in Arlington, Virginia; backed by Kleiner Perkins.
